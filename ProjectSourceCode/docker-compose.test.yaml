services:
  db-test:
    image: postgres:17.6
    env_file: .env.test
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - tally-test-db:/var/lib/postgresql/data
      - ./src/init_data:/docker-entrypoint-initdb.d:ro
  tests:
    image: node:22.19.0-bookworm
    working_dir: /repository
    env_file: .env.test
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./:/repository
      - tally-test-node-modules:/repository/node_modules
    command: ['npm', 'test']
volumes:
  tally-test-db:
  tally-test-node-modules: