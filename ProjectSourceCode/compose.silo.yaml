
services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: tallydev
      MINIO_ROOT_PASSWORD: tally-local-dev-only-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - tally-silo-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  silo-init:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://tallydev:tally-local-dev-only-password@silo:9000"
    entrypoint: ["/usr/bin/mcli"]
    command: ["mb", "--ignore-existing", "local/tally-assignments"]
    restart: "no"

  db:
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    environment:
      AWS_PROFILE: ""
      AWS_ACCESS_KEY_ID: tallydev
      AWS_SECRET_ACCESS_KEY: tally-local-dev-only-password
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: tally-assignments
      S3_ENDPOINT: http://silo:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      db:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully

volumes:
  tally-silo-data:
